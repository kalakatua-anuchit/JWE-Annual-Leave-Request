<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ขอวันลา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F2;--surface:#fff;--ink:#14262C;--muted:#5B7077;--line:#D5DFDD;
  --brand:#0A7C8C;--brand-d:#07606C;
  --ok-bg:#DCF0E3;--ok:#1B6A3C;
  --near-bg:#FBE8BC;--near:#7A4F00;
  --full-bg:#F7D9E1;--full:#8C1D43;
  --wait:#F0A53A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans Thai","Sukhumvit Set",Thonburi,Tahoma,sans-serif}
h1,h2,h3,h4{font-family:Prompt,"Noto Sans Thai",sans-serif;font-weight:600;margin:0;line-height:1.25}
h1{font-size:26px}
h2{font-size:20px}
h3{font-size:17px}
a{color:var(--brand-d)}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 130px}
.wrap.wide{max-width:920px}
.wrap.narrow{max-width:420px;padding-top:56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 0 10px}
.sub{color:var(--muted);font-size:14px}
.hint{color:var(--muted);font-size:14px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.form{display:grid;gap:14px}
label{display:grid;gap:6px;font-weight:500;font-size:15px}
label.chk{display:flex;gap:8px;align-items:center;font-weight:400}
input,select,textarea{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
input[type=checkbox]{width:auto;accent-color:var(--brand)}
input:focus-visible,select:focus-visible,textarea:focus-visible,.btn:focus-visible,.tabs button:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;background:var(--brand);color:#fff;cursor:pointer}
.btn:hover{background:var(--brand-d)}
.btn.ghost{background:transparent;color:var(--brand-d);border:1.5px solid var(--line)}
.btn.ghost:hover{background:#F3F8F7}
.btn.danger{background:#B3263F}
.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.foot{text-align:center;margin-top:18px;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 0}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:14px}
.chip b{font-family:Prompt,sans-serif;color:var(--brand-d)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0}
.tabs button{flex:1;background:none;border:0;padding:10px 6px;font:inherit;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:var(--brand-d);border-color:var(--brand);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:0 0 6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.month{margin-top:20px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:13px;color:var(--muted);margin:8px 0 4px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{aspect-ratio:1/1.08;border-radius:8px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;font:inherit;line-height:1.15;cursor:pointer;color:inherit}
.cell b{font-size:16px;font-weight:600}
.cell small{font-size:10.5px;white-space:nowrap}
.cell:disabled{cursor:default}
.cell:focus-visible{outline:3px solid var(--ink);outline-offset:1px}
.cell.blank{visibility:hidden}
.cell.off{background:transparent;color:#9BAAAE;cursor:default}
.free{background:var(--ok-bg);color:var(--ok)}
.near{background:var(--near-bg);color:var(--near)}
.full{background:var(--full-bg);color:var(--full)}
.closed{background:#E3E9E8;color:#6A7C82}
.holiday{background:repeating-linear-gradient(135deg,#E3E9E8 0 5px,#F1F5F4 5px 10px);color:#6A7C82}
.mine{background:var(--brand);color:#fff}
.minewait{background:var(--wait);color:#3A2400}
.cell.sel{border-color:var(--ink);box-shadow:inset 0 0 0 2px #fff}
.cell.today b{text-decoration:underline;text-underline-offset:3px}
.cell.ovr::after{content:"";position:absolute}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;box-shadow:0 -6px 18px rgba(10,40,50,.08)}
.bar input{width:84px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.row .r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.b{font-style:normal;font-size:13px;padding:2px 10px;border-radius:999px;font-weight:500;white-space:nowrap}
.b.ok{background:var(--ok-bg);color:var(--ok)}
.b.wait{background:var(--near-bg);color:var(--near)}
.b.cancel{background:#E3E9E8;color:#5B7077}
.sec{margin:20px 0 8px;font-size:15px;color:var(--muted);font-weight:600}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
dialog{border:0;border-radius:16px;padding:0;width:min(520px,calc(100% - 24px));max-height:88vh;color:var(--ink);background:var(--surface)}
dialog::backdrop{background:rgba(10,30,36,.5)}
.dlg{padding:18px;display:grid;gap:12px}
.dlg ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.dlg li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;background:#F3F8F7;border-radius:8px;font-size:15px}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.warn{background:var(--near-bg);color:var(--near);padding:10px 12px;border-radius:10px;font-size:14px}
.errtxt{color:var(--full);font-size:14px}
.okbox{background:var(--ok-bg);color:var(--ok);padding:10px 12px;border-radius:10px;font-size:14px}
.ecard{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;margin-bottom:12px}
.ecard h4{grid-column:1/-1}
#overlay{position:fixed;inset:0;background:rgba(238,243,242,.65);display:flex;align-items:center;justify-content:center;z-index:50}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--brand);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-90px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;max-width:calc(100% - 28px);transition:transform .2s;font-size:15px}
#toast.show{transform:translate(-50%,0)}
#toast.err{background:#B3263F}
.tbl{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}
.tbl th{background:#F3F8F7;font-weight:600}
.scroll{overflow-x:auto}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters select{width:auto;min-width:150px}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}#toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay" hidden><div class="spin" role="progressbar" aria-label="กำลังโหลด"></div></div>
<div id="toast" role="status"></div>
<dialog id="dlg"></dialog>

<script>
/* ==================== ตั้งค่า ==================== */
// วาง URL ของ Web App ที่ได้จากการ Deploy ใน Apps Script ตรงนี้
const API_URL = 'https://script.google.com/macros/s/AKfycbzZtHTp2TwaRggGHUVARBUK3bwm4W3pTmPrYUFgIljYiOPluSYPmE3061OMePcQYl_w/exec';

/* ==================== ตัวช่วย ==================== */
const TYPE = { vacation: 'พักร้อน', annual: 'วันหยุดประจำปี' };
const DOW = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
const PLAB = ['', 'ม.ค.–ก.พ.', 'มี.ค.–เม.ย.', 'พ.ค.–มิ.ย.', 'ก.ค.–ส.ค.', 'ก.ย.–ต.ค.', 'พ.ย.–ธ.ค.'];
const periodOf = d => Math.ceil(+d.slice(5, 7) / 2);
const annBal = (bs, y, p) => ((bs.find(b => b.year === y) || { annual: [] }).annual[p - 1]) || null;
function periodsBetween(from, to) {
  const out = []; let [y, m] = from.split('-').map(Number); const [ty, tm] = to.split('-').map(Number);
  while (y < ty || (y === ty && m <= tm)) {
    const p = Math.ceil(m / 2); if (!out.some(o => o.y === y && o.p === p)) out.push({ y, p });
    m++; if (m > 12) { m = 1; y++; }
  }
  return out;
}
function periodsOfDates(dates) {
  const out = []; dates.forEach(d => { const y = +d.slice(0, 4), p = periodOf(d); if (!out.some(o => o.y === y && o.p === p)) out.push({ y, p }); });
  return out;
}
function balanceChips(bals, from, to) {
  const two = bals.length > 1;
  let h = bals.map(b => '<span class="chip">พักร้อน' + (two ? ' ปี ' + (b.year + 543) : '') + ' เหลือ <b>' + (b.vacation.total - b.vacation.used) + '</b>/' + b.vacation.total + ' วัน</span>').join('');
  h += periodsBetween(from, to).map(o => {
    const a = annBal(bals, o.y, o.p); if (!a) return '';
    return '<span class="chip">วันหยุดประจำปี ' + PLAB[o.p] + (two ? ' ' + (o.y + 543) : '') + ' เหลือ <b>' + (a.total - a.used) + '</b>/' + a.total + ' วัน</span>';
  }).join('');
  return h;
}
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const iso = (y, m, d) => y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
const fmtLong = d => parse(d).toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const fmtShort = d => parse(d).toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short' });
const monthName = (y, m) => new Date(y, m - 1, 1).toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });

let A = {
  role: null, adminPin: null, mode: null,
  cal: null, st: null, sess: null, lockT: null, ad: null,
  tab: 'cal', sel: new Set(), multi: false, loadedAt: 0, filter: { emp: '', month: '' }
};

async function post(body) {
  let res;
  try { res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) }); }
  catch (e) { throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้ง'); }
  let j;
  try { j = await res.json(); }
  catch (e) { throw new Error('เซิร์ฟเวอร์ตอบกลับผิดรูปแบบ ตรวจสอบว่า Deploy แบบ "Anyone" แล้ว'); }
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
let busyN = 0;
async function busy(p) {
  busyN++; $('#overlay').hidden = false;
  try { return await p; } finally { if (--busyN === 0) $('#overlay').hidden = true; }
}
function toast(msg, err) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.className = ''; }, 4000);
}
function call(action, extra) {
  const body = Object.assign({ action }, extra || {});
  if (A.role === 'admin') body.admin_pin = A.adminPin;
  else if (A.sess && body.emp_id === undefined) { body.emp_id = A.sess.id; body.pin = A.sess.pin; }
  return busy(post(body));
}
const fail = e => toast(e.message || String(e), true);

function openDlg(html) { const d = $('#dlg'); d.innerHTML = '<div class="dlg">' + html + '</div>'; if (!d.open) d.showModal(); }
function closeDlg() { const d = $('#dlg'); if (d.open) d.close(); }

function badge(status, pos) {
  if (status === 'confirmed') return '<em class="b ok">ยืนยันแล้ว</em>';
  if (status === 'waitlist') return '<em class="b wait">รอคิวลำดับที่ ' + pos + '</em>';
  return '<em class="b cancel">ยกเลิกแล้ว</em>';
}
const dayMap = days => { const m = {}; days.forEach(x => { m[x.d] = x; }); return m; };

/* ==================== ปฏิทิน ==================== */
function calendarHTML(days, cellFn) {
  const by = {}; days.forEach(x => { by[x.d] = x; });
  const months = [];
  days.forEach(x => { const k = x.d.slice(0, 7); if (!months.includes(k)) months.push(k); });
  return months.map(k => {
    const [y, m] = k.split('-').map(Number);
    const first = new Date(y, m - 1, 1).getDay(), n = new Date(y, m, 0).getDate();
    let cells = '';
    for (let i = 0; i < first; i++) cells += '<div class="cell blank"></div>';
    for (let d = 1; d <= n; d++) {
      const key = iso(y, m, d);
      cells += by[key] ? cellFn(by[key]) : '<div class="cell off"><b>' + d + '</b></div>';
    }
    return '<section class="month"><h3>' + monthName(y, m) + '</h3><div class="dow">' +
      DOW.map(x => '<span>' + x + '</span>').join('') + '</div><div class="grid">' + cells + '</div></section>';
  }).join('');
}
function cellHTML(x, cls, sub, dis, extra) {
  const sel = A.sel.has(x.d) ? ' sel' : '';
  const today = x.d === (A.role === 'admin' ? A.ad : A.cal).today ? ' today' : '';
  return '<button class="cell ' + cls + sel + today + '" data-act="day" data-d="' + x.d + '"' + (dis ? ' disabled' : '') +
    ' aria-label="' + esc(fmtShort(x.d) + ' ' + (extra || sub)) + '"><b>' + (+x.d.slice(8)) + '</b><small>' + sub + '</small></button>';
}
function empCell(x) {
  let cls = 'free', sub = '', dis = false;
  if (x.m) { cls = x.m.status === 'confirmed' ? 'mine' : 'minewait'; sub = x.m.status === 'confirmed' ? 'ลาแล้ว' : 'คิว ' + x.m.pos; }
  else if (x.d < A.cal.min_date) { cls = 'off'; dis = true; }
  else if (x.h) { cls = 'holiday'; sub = 'หยุด'; dis = true; }
  else if (x.q <= 0) { cls = 'closed'; sub = 'ปิด'; dis = true; }
  else {
    const rem = x.q - x.c;
    if (rem >= 2) { cls = 'free'; sub = 'ว่าง ' + rem; }
    else if (rem === 1) { cls = 'near'; sub = 'ว่าง 1'; }
    else { cls = 'full'; sub = 'เต็ม'; }
  }
  return cellHTML(x, cls, sub, dis);
}
function admCell(x) {
  let cls, sub;
  if (x.h) { cls = 'holiday'; sub = esc(x.h.slice(0, 5)); }
  else if (x.q <= 0) { cls = 'closed'; sub = 'ปิด'; }
  else {
    const rem = x.q - x.c;
    cls = rem >= 2 ? 'free' : rem === 1 ? 'near' : 'full';
    sub = x.c + '/' + x.q + (x.w ? '+' + x.w : '') + (x.override ? '*' : '');
  }
  return cellHTML(x, cls, sub, false);
}
const legendEmp = '<div class="legend"><span><i style="background:var(--ok-bg)"></i>ว่าง</span><span><i style="background:var(--near-bg)"></i>เหลือ 1 ที่</span><span><i style="background:var(--full-bg)"></i>เต็ม แต่เข้าคิวสำรองได้</span><span><i style="background:#E3E9E8"></i>วันหยุด/ปิดรับ</span></div>';

/* ==================== หน้าสาธารณะ (ไม่ต้องล็อกอิน) ==================== */
function adminLoginView() {
  return '<div class="wrap narrow"><h1>แอดมิน</h1><p class="sub">ใส่รหัสแอดมินเพื่อจัดการวันลา</p><div class="card form" style="margin-top:14px"><label>รหัสแอดมิน<input id="a-pin" type="password" inputmode="numeric" autocomplete="off"></label><button class="btn" data-act="admin-login">เข้าสู่ระบบแอดมิน</button></div><p class="foot"><a href="#" data-act="to-emp">กลับไปหน้าปฏิทิน</a></p></div>';
}
function publicView() {
  if (API_URL.startsWith('PASTE')) {
    return '<div class="wrap narrow"><div class="card form"><h2>ยังไม่ได้เชื่อมต่อระบบ</h2><p class="hint">เปิดไฟล์นี้ด้วยโปรแกรมแก้ไขข้อความ แล้วใส่ URL ของ Web App ที่ได้จากการ Deploy ไว้ที่ตัวแปร API_URL ใกล้ส่วนบนของสคริปต์</p></div></div>';
  }
  const c = A.cal;
  if (!c) return '<div class="wrap narrow"><div class="card form"><h2>โหลดข้อมูลไม่สำเร็จ</h2><p class="hint">ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่</p><button class="btn" data-act="retry">ลองใหม่</button></div></div>';
  let body;
  if (A.tab === 'cal') {
    body = '<p class="hint" style="margin-bottom:10px">แตะวันที่ต้องการลา (เลือกได้หลายวัน) แล้วกด "ถัดไป" ขอได้ตั้งแต่ ' + fmtShort(c.min_date) + ' ถึง ' + fmtShort(c.max_date) + '</p>' + legendEmp + calendarHTML(c.days, empCell);
  } else body = mineView();
  const bar = (A.tab === 'cal' && A.sel.size)
    ? '<div class="bar"><b>เลือก ' + A.sel.size + ' วัน</b><button class="btn ghost sm" data-act="clear-sel">ล้าง</button><button class="btn" data-act="next">ถัดไป</button></div>' : '';
  return '<div class="wrap"><div class="top"><div><h2>' + esc(c.title) + '</h2><div class="sub">ดูวันที่ว่างและขอลาได้เลย</div></div></div>' +
    '<nav class="tabs"><button data-act="tab" data-t="cal" class="' + (A.tab === 'cal' ? 'on' : '') + '">ปฏิทิน</button><button data-act="tab" data-t="mine" class="' + (A.tab === 'mine' ? 'on' : '') + '">คำร้องของฉัน</button></nav>' +
    body + bar + '<p class="foot"><a href="#" data-act="to-admin">สำหรับแอดมิน</a></p></div>';
}
function mineView() {
  const c = A.cal;
  if (!A.st) {
    return '<div class="card form"><h3>ดู แก้ไข หรือยกเลิกคำร้องของฉัน</h3><p class="hint">ต้องใช้ PIN ของคุณ เพื่อกันไม่ให้ใครมายกเลิกหรือแก้คำร้องแทน</p>' +
      '<label>ชื่อ<select id="u-emp"><option value="">— เลือกชื่อ —</option>' + c.people.map(p => '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>').join('') + '</select></label>' +
      '<label>PIN<input id="u-pin" type="password" inputmode="numeric" autocomplete="off"></label>' +
      '<button class="btn" data-act="unlock">เปิดดูคำร้อง</button></div>';
  }
  const st = A.st, chips = balanceChips(st.balances, st.today, st.max_date);
  return '<div class="top" style="padding-top:0"><div><h3>' + esc(st.me.name) + '</h3></div><button class="btn ghost sm" data-act="lock">ออก</button></div><div class="chips">' + chips + '</div>' + myListHTML();
}
function reqRow(r) {
  return '<div class="row"><div><b>' + fmtLong(r.date) + '</b><div class="sub">' + TYPE[r.type] + (r.note ? ' – ' + esc(r.note) : '') + '</div></div><div class="r">' +
    badge(r.status, r.pos) + (r.status !== 'cancelled' && r.date >= A.st.today ? '<button class="btn ghost sm" data-act="open-req" data-id="' + r.id + '">จัดการ</button>' : '') + '</div></div>';
}
function myListHTML() {
  const m = A.st.mine, t = A.st.today;
  const up = m.filter(r => r.status !== 'cancelled' && r.date >= t).sort((a, b) => a.date.localeCompare(b.date));
  const past = m.filter(r => r.status !== 'cancelled' && r.date < t).sort((a, b) => b.date.localeCompare(a.date));
  const can = m.filter(r => r.status === 'cancelled').slice(0, 20);
  let h = '<div class="sec">กำลังจะถึง</div>' + (up.length ? up.map(reqRow).join('') : '<div class="empty">ยังไม่มีคำร้อง ไปเลือกวันที่หน้าปฏิทินได้เลย</div>');
  if (past.length) h += '<div class="sec">ผ่านมาแล้ว</div>' + past.map(reqRow).join('');
  if (can.length) h += '<div class="sec">ยกเลิกแล้ว</div>' + can.map(reqRow).join('');
  return h;
}

function reqCheck() {
  const id = $('#f-emp').value, type = $('#f-type').value, dates = [...A.sel].sort();
  const bal = $('#f-bal'), err = $('#f-err'), go = $('#f-go');
  if (!id) { bal.textContent = 'เลือกชื่อเพื่อดูวันลาที่เหลือ'; err.textContent = ''; go.disabled = true; return; }
  const name = (A.cal.people.find(p => p.id === id) || {}).name || '';
  const bs = A.cal.balances[id] || [], two = bs.length > 1, pers = periodsOfDates(dates);
  const vac = bs.map(b => (two ? 'ปี ' + (b.year + 543) + ' ' : '') + 'พักร้อนเหลือ ' + (b.vacation.total - b.vacation.used) + '/' + b.vacation.total).join(' · ');
  const ann = pers.map(o => { const a = annBal(bs, o.y, o.p); return a ? 'วันหยุดประจำปี ' + PLAB[o.p] + ' เหลือ ' + (a.total - a.used) + '/' + a.total : ''; }).filter(Boolean).join(' · ');
  bal.textContent = 'วันลาของ ' + name + ': ' + [vac, ann].filter(Boolean).join(' | ');
  let msg = '';
  if (type === 'vacation') {
    bs.forEach(b => {
      const need = dates.filter(d => +d.slice(0, 4) === b.year).length, rem = b.vacation.total - b.vacation.used;
      if (need > rem) msg = 'สิทธิ์พักร้อน' + (two ? 'ปี ' + (b.year + 543) : '') + 'ไม่พอ (ต้องการ ' + need + ' วัน เหลือ ' + rem + ' วัน)';
    });
  } else {
    pers.forEach(o => {
      const a = annBal(bs, o.y, o.p), need = dates.filter(d => +d.slice(0, 4) === o.y && periodOf(d) === o.p).length;
      if (!a || a.total <= 0) msg = 'ช่วง ' + PLAB[o.p] + ' ไม่มีวันหยุดประจำปีให้ใช้';
      else if (need > a.total - a.used) msg = 'วันหยุดประจำปีช่วง ' + PLAB[o.p] + ' ไม่พอ (ต้องการ ' + need + ' วัน เหลือ ' + (a.total - a.used) + ' วัน)';
    });
  }
  err.textContent = msg; go.disabled = !!msg;
}

  return '<div class="card form"><label>ชื่อระบบ<input id="s-title" value="' + esc(s.title) + '"></label>' +
    '<div class="ecard" style="margin:0"><label>ลาล่วงหน้าขั้นต่ำ (วัน)<input id="s-min" type="number" min="0" max="60" value="' + s.min_advance_days + '"></label><label>ลาล่วงหน้าสูงสุด (เดือน)<input id="s-max" type="number" min="1" max="12" value="' + s.max_advance_months + '"></label><label>โควต้าเริ่มต้นต่อวัน (คน)<input id="s-def" type="number" min="0" max="50" value="' + s.default_quota + '"></label></div>' +
    '<div><b>วันหยุดประจำปีต่อคน แยกตามช่วง (ค่าเริ่มต้นของทุกคน)</b><p class="hint">พนักงานใช้ได้เฉพาะวันที่อยู่ในช่วงนั้น เลือกเดือนไหนในช่วงก็ได้ วันที่เหลือเมื่อจบช่วงจะหมดไป ปรับรายคนได้ที่แท็บพนักงาน</p></div>' +
    '<div class="ecard" style="margin:0">' + [1, 2, 3, 4, 5, 6].map(i => '<label>' + PLAB[i] + '<input id="s-ap' + i + '" type="number" min="0" max="60" value="' + (s['ap' + i] != null ? s['ap' + i] : 0) + '"></label>').join('') + '</div>' +
    '<div><b>โควต้าตามวันในสัปดาห์</b><p class="hint">เว้นว่างไว้ = ใช้โควต้าเริ่มต้น</p></div>' +
    '<div class="ecard" style="margin:0">' + wd.map((n, i) => '<label>' + n + '<input id="s-q' + i + '" type="number" min="0" max="50" value="' + esc(s['q' + i]) + '"></label>').join('') + '</div>' +
    '<label>ลิงก์หน้าเว็บนี้ (ใส่ในอีเมลแจ้งเตือน)<input id="s-url" value="' + esc(s.page_url) + '" placeholder="https://..."></label>' +
    '<label>เปลี่ยนรหัสแอดมิน (เว้นว่างถ้าไม่เปลี่ยน)<input id="s-pin" type="password" inputmode="numeric" autocomplete="new-password"></label>' +
    '<button class="btn" data-act="save-set">บันทึกการตั้งค่า</button></div>';
}
function exportCSV() {
  const f = A.filter;
  const rows = A.ad.requests.filter(r => (!f.emp || r.emp_id === f.emp) && (!f.month || r.date.startsWith(f.month))).sort((a, b) => a.date.localeCompare(b.date))
    .map(r => [r.date, r.name, TYPE[r.type], r.status === 'confirmed' ? 'ยืนยันแล้ว' : r.status === 'waitlist' ? 'รอคิวลำดับที่ ' + r.pos : 'ยกเลิกแล้ว', r.note]);
  const csv = '\ufeff' + [['วันที่ลา', 'พนักงาน', 'ประเภท', 'สถานะ', 'หมายเหตุ']].concat(rows).map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = 'leave-requests.csv'; a.click();
}

/* ==================== เรนเดอร์ & อีเวนต์ ==================== */
function render() {
  const y = window.scrollY;
  $('#app').innerHTML = A.role === 'admin' ? adminView() : (A.mode === 'admin' ? adminLoginView() : publicView());
  window.scrollTo(0, y);
}
function logout() {
  A.role = null; A.adminPin = null; A.ad = null; A.sel.clear(); A.mode = null; A.tab = 'cal'; A.multi = false;
  render();
}
async function loadCalendar() {
  A.cal = await busy(post({ action: 'calendar' }));
  A.loadedAt = Date.now(); document.title = A.cal.title;
}
async function doAdminLogin() {
  A.role = 'admin'; A.adminPin = $('#a-pin').value.trim();
  try { A.ad = await call('admin_state'); A.tab = 'cal'; A.sel.clear(); A.loadedAt = Date.now(); render(); }
  catch (e) { A.role = null; A.adminPin = null; fail(e); }
}
async function refresh() {
  try {
    if (A.role === 'admin') A.ad = await call('admin_state');
    else { A.cal = await call('calendar'); if (A.sess) A.st = await call('state'); }
    A.loadedAt = Date.now();
    if (!$('#dlg').open) render();
  } catch (e) { fail(e); }
}
function dayClick(d) {
  if (A.role === 'admin' && !A.multi) return openDay(d);
  if (A.sel.has(d)) A.sel.delete(d); else A.sel.add(d);
  render();
}
function readEmp(card) {
  const g = n => card.querySelector('[name=' + n + ']');
  const o = { id: card.dataset.id, name: g('name').value, pin: g('pin').value, email: g('email').value, vacation_days: g('vacation_days').value, active: g('active').checked };
  for (let i = 1; i <= 6; i++) o['ap' + i] = g('ap' + i).value;
  return o;
}

document.addEventListener('click', async ev => {
  if (A.sess) startAutoLock();
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, d = el.dataset.d;
  if (el.tagName === 'A') ev.preventDefault();
  if (act === 'filter' || act === 'multi') return; // handled in change
  switch (act) {
    case 'admin-login': return doAdminLogin();
    case 'to-admin': A.mode = 'admin'; return render();
    case 'to-emp': A.mode = null; return render();
    case 'logout': return logout();
    case 'retry': try { await loadCalendar(); } catch (e) { fail(e); } return render();
    case 'tab': if (A.role !== 'admin' && el.dataset.t !== 'mine') lock(); A.tab = el.dataset.t; A.sel.clear(); return render();
    case 'unlock': return unlock();
    case 'lock': lock(); return render();
    case 'day': return dayClick(d);
    case 'clear-sel': A.sel.clear(); return render();
    case 'next': return openRequestDialog();
    case 'close': return closeDlg();
    case 'submit-req': return submitRequest();
    case 'open-req': return openReq(id);
    case 'edit-req': return openEdit(id);
    case 'do-edit': return doEdit(id);
    case 'cancel-req': return confirmCancel(id);
    case 'do-cancel': return doCancel(id);
    case 'export': return exportCSV();
    case 'a-cancel': {
      if (!confirm('ยกเลิกคำร้องนี้? คนในคิวสำรองจะขยับขึ้น')) return;
      return admCall('admin_cancel', { request_id: id, reason: 'แอดมินยกเลิก' }, d || null);
    }
    case 'd-quota': return admCall('admin_set_quota', { dates: [d], quota: $('#d-q').value }, d);
    case 'd-hol': return admCall('admin_set_holiday', { dates: [d], name: $('#d-h').value || 'วันหยุด' }, d);
    case 'd-unhol': return admCall('admin_set_holiday', { dates: [d], remove: true }, d);
    case 'd-add': {
      const res = await admCall('admin_add', { emp_id: $('#d-emp').value, dates: [d], type: $('#d-type').value }, d);
      if (res) { const r = res.results[0]; toast(r.ok ? 'เพิ่มคำร้องแล้ว' : r.error, !r.ok); }
      return;
    }
    case 'm-quota': { const dates = [...A.sel]; A.sel.clear(); return admCall('admin_set_quota', { dates, quota: $('#m-q').value }); }
    case 'm-hol': { const name = prompt('ชื่อวันหยุด', 'วันหยุด'); if (name === null) return; const dates = [...A.sel]; A.sel.clear(); const res = await admCall('admin_set_holiday', { dates, name }); if (res && res.affected) toast('มีคำร้องเดิม ' + res.affected + ' รายการในวันที่เลือก ตรวจสอบและยกเลิกเองได้ที่หน้าคำร้อง'); return; }
    case 'm-clear': { const dates = [...A.sel]; A.sel.clear(); await admCall('admin_set_quota', { dates, quota: '' }); return admCall('admin_set_holiday', { dates, remove: true }); }
    case 'save-emp': {
      const res = await admCall('admin_save_employee', { employee: readEmp(el.closest('.ecard')) });
      if (res) toast('บันทึกแล้ว');
      return;
    }
    case 'save-set': {
      const s = { title: $('#s-title').value, page_url: $('#s-url').value, min_advance_days: $('#s-min').value, max_advance_months: $('#s-max').value, default_quota: $('#s-def').value, admin_pin: $('#s-pin').value };
      for (let i = 0; i < 7; i++) s['q' + i] = $('#s-q' + i).value;
      for (let i = 1; i <= 6; i++) s['ap' + i] = $('#s-ap' + i).value;
      const res = await admCall('admin_save_settings', { settings: s });
      if (res) { if (s.admin_pin) A.adminPin = s.admin_pin; toast('บันทึกการตั้งค่าแล้ว'); }
      return;
    }
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.act === 'multi') { A.multi = t.checked; A.sel.clear(); render(); }
  else if (t.dataset && t.dataset.act === 'filter') { A.filter = { emp: $('#f-emp').value, month: $('#f-month').value }; render(); }
  else if (t.id === 'e-date' || t.id === 'e-ack') editCheck();
  else if (t.id === 'f-emp' || t.id === 'f-type') reqCheck();
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter') return;
  if (ev.target.id === 'u-pin') unlock();
  else if (ev.target.id === 'a-pin') doAdminLogin();
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && (A.cal || A.ad) && Date.now() - A.loadedAt > 30000) refresh();
});

/* ==================== เริ่มทำงาน ==================== */
(async function init() {
  if (!API_URL.startsWith('PASTE')) { try { await loadCalendar(); } catch (e) { fail(e); } }
  render();
})();
</script>
</body>
</html>
